packages:
  - "apps/*"
  - "packages/*"
# Security floor for a transitive dep (pnpm audit): next pins an older 8.x
# postcss; 8.5.18+ fixes GHSA path-traversal/XSS advisories. Same major, safe.
overrides:
  postcss: ">=8.5.18"
  # Scoped to swagger (its own dep line is 5.2.1; 5.2.2 fixes a parsing DoS)
  # so the rest of the tree keeps whatever js-yaml major it expects.
  "@nestjs/swagger>js-yaml": ">=5.2.2"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry/cli': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12'
  - '@expo/router-server@57.0.5'
  - '@expo/ui@57.0.9'
  - expo-constants@57.0.9
  - expo-linking@57.0.5
  - expo-modules-core@57.0.9
  - expo-router@57.0.10
  - expo@57.0.10
